<!DOCTYPE html>
<html>

    <head>

        <title>JSonLogReader</title>
        <link rel="stylesheet" type="text/css" href="common.css">
    </head>

    <body>

        <search id='search' hidden>
            <input id='searchInput'>

        </search>
