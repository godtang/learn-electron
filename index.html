<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>JSonLogReader</title>
    <link rel="stylesheet" type="text/css" href="common.css">
</head>

<body>
    <!-- You can also require other files to run in this process -->
    <script src="./renderer.js"></script>
    <search id='search' hidden>
        <input id='searchInput'>
        <button id='searchBtn' onclick="findString()">查找</button>
        <input id='highlightInput' placeholder="高亮关键词，多个用逗号分隔">
        <button onclick="applyHighlight()">应用高亮</button>
        <button onclick="clearHighlight()">清除高亮</button>
        <button onclick="toggleFilter()">只显示高亮</button>
    </search>


</body>

</html>
